[project]
name = "dogtrips-graph"
version = "0.1.0"
description = "Capa de grafo para DogTrips: emparejamiento de paseadores y armado de paseos grupales sobre Neo4j AuraDB"
requires-python = ">=3.13"
dependencies = [
    "neo4j>=5.28",
    "python-dotenv>=1.0",
    "django>=5.2",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.6",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
